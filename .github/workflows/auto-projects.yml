# Sync my public GitHub repos that have a live website onto the site (scripts/auto-projects.mjs), then
# commit the data + media only if something changed. Netlify rebuilds on the push.
name: Auto projects

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Re-capture every project, even if unchanged"
        type: boolean
        default: false

permissions:
  contents: write # push the synced data; nothing else

concurrency:
  group: auto-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Capture uses Playwright's "chrome" channel (Google Chrome, preinstalled on the runner).
      - name: Ensure Google Chrome
        run: google-chrome --version || npx playwright install --with-deps chrome

      - name: Sync projects from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/auto-projects.mjs ${{ inputs.force && '--force' || '' }}

      - name: Check for changes
        id: diff
        run: |
          git add -A src/data/auto-projects.json public/images/projects/auto public/videos/auto
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Only push data that builds: a failure here stops the job and the last good data stays live.
      - name: Lint + build
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint && npm run build

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync auto projects from GitHub"
          git push
